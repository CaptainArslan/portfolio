<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom subtle pulsing for the technical glow */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 4s ease-in-out infinite;
        }
        /* Loading progress simulation */
        @keyframes progress-load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progress-load 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e1e2e4",
                        "primary-fixed": "#dce1ff",
                        "on-surface-variant": "#434654",
                        "inverse-surface": "#2e3132",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9fb",
                        "surface-container-high": "#e7e8ea",
                        "on-error": "#ffffff",
                        "surface-dim": "#d9dadc",
                        "surface-variant": "#e1e2e4",
                        "primary-container": "#3c6bed",
                        "on-primary-fixed": "#00164d",
                        "secondary": "#4c5c91",
                        "primary": "#1550d3",
                        "surface-bright": "#f8f9fb",
                        "on-secondary-fixed": "#03174a",
                        "on-primary-container": "#fffbff",
                        "on-secondary-container": "#3e4e82",
                        "outline": "#737686",
                        "on-primary-fixed-variant": "#003cad",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#fffbff",
                        "surface": "#f8f9fb",
                        "surface-container": "#edeef0",
                        "tertiary-container": "#b75b00",
                        "primary-fixed-dim": "#b5c4ff",
                        "outline-variant": "#c3c5d7",
                        "inverse-on-surface": "#f0f1f3",
                        "on-tertiary-fixed-variant": "#723600",
                        "error-container": "#ffdad6",
                        "surface-tint": "#1a53d6",
                        "secondary-fixed-dim": "#b5c4ff",
                        "secondary-fixed": "#dce1ff",
                        "on-secondary-fixed-variant": "#344477",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed": "#311300",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffdcc6",
                        "tertiary-fixed-dim": "#ffb786",
                        "secondary-container": "#b2c2fd",
                        "on-background": "#191c1e",
                        "on-primary": "#ffffff",
                        "on-surface": "#191c1e",
                        "tertiary": "#924700",
                        "inverse-primary": "#b5c4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body overflow-hidden">
<!-- Preloader Canvas -->
<main class="relative h-screen w-screen flex flex-col items-center justify-center p-8">
<!-- Background Intelligent Glow -->
<div class="absolute inset-0 z-0 flex items-center justify-center">
<div class="w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] animate-pulse-soft"></div>
<div class="absolute w-[300px] h-[300px] bg-secondary/5 rounded-full blur-[80px] animate-pulse-soft" style="animation-delay: -2s;"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col items-center max-w-md w-full">
<!-- Geometric Logo Container -->
<div class="relative mb-16 flex items-center justify-center">
<!-- Architectural System Lines (Decorative Background) -->
<svg class="absolute w-64 h-64 text-outline-variant/20" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="48" stroke="currentColor" stroke-dasharray="2 2" stroke-width="0.25"></circle>
<line stroke="currentColor" stroke-width="0.25" x1="0" x2="100" y1="50" y2="50"></line>
<line stroke="currentColor" stroke-width="0.25" x1="50" x2="50" y1="0" y2="100"></line>
<rect height="50" stroke="currentColor" stroke-width="0.25" width="50" x="25" y="25"></rect>
</svg>
<!-- Technical Pulsing 'A' Logo -->
<div class="relative flex items-center justify-center w-32 h-32">
<svg class="w-full h-full text-primary" viewbox="0 0 100 100">
<path d="M50 15L85 85H70L50 45L30 85H15L50 15Z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
<path d="M40 65H60" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
</svg>
<!-- Pulse Core -->
<div class="absolute inset-0 bg-primary/10 rounded-full animate-ping opacity-20"></div>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-10">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-2">
                    Arslan
                </h1>
<p class="font-label text-sm uppercase tracking-[0.3em] text-on-surface-variant font-medium">
                    Loading Precision...
                </p>
</div>
<!-- Sophisticated Loading Bar -->
<div class="w-full max-w-[240px] space-y-4">
<div class="h-[2px] w-full bg-surface-container-highest rounded-full overflow-hidden relative">
<!-- Progress Fill -->
<div class="absolute top-0 left-0 h-full bg-primary animate-progress"></div>
</div>
<!-- Technical Metadata Labels -->
<div class="flex justify-between items-center px-1">
<span class="text-[10px] font-mono text-outline uppercase tracking-widest">System Initializing</span>
<span class="text-[10px] font-mono text-primary font-bold">2.4ms</span>
</div>
</div>
</div>
<!-- Footer / Branding Hook -->
<div class="absolute bottom-12 z-10 flex flex-col items-center">
<div class="flex items-center gap-3 mb-4">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="text-[11px] font-medium text-on-surface-variant uppercase tracking-widest font-label">Engineering the future</span>
</div>
<!-- Structural Line -->
<div class="w-px h-12 bg-gradient-to-b from-outline-variant/30 to-transparent"></div>
</div>
<!-- Hidden Image for Background Context (Meta Reference) -->
<div class="hidden">
<img alt="Technical background reference" data-alt="close-up of a high-tech processor or circuit board with glowing blue lights and clean metallic lines in a minimalist setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGosGSkzys8S8GzH9SJgbZx4fSlgdR9HGpWmtf7Hdp8L5e67dmXGb9djprI6jJShFTPGQqEgZRaUt_ca7FEb4JTSzKwcB6jqmM2SpF0UfZ-WQSGPEiYDksIc4l4fpXqnRS8xIiEKkEWDFrBwBjfXD4JEVu8u-aO160iOxK23nYuopePcyKvYfjAlCfK09itxSJhr_qtvBphSnGOox4YSZw9W7Ii88gKEm10vz36GQdg__psDke1E1n_eFq6zVe2TfSMzpfJoHmAk8Z"/>
</div>
</main>
<!-- Shared Component Shell (Normally Hidden or Subtle in Preloader) -->
<!-- The TopNavBar is suppressed as per the "Linear/Transactional/Task-Focused" rule for a preloader screen -->
<!-- Footer from JSON (Applied with suppression logic - usually hidden in full-page loaders, but placed here if the design transitions out) -->
<footer class="hidden">
<div class="flex flex-col md:flex-row justify-between items-center px-8 py-12 max-w-7xl mx-auto border-t border-slate-200/50 dark:border-slate-800/50">
<p class="font-['Inter'] text-sm leading-relaxed text-slate-500 dark:text-slate-400">© 2024 Arslan Engineering. Built for Precision.</p>
</div>
</footer>
</body></html>
